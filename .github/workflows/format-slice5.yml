name: Format Slice 5

on:
  push:
    branches: [feat/campaign-message-materialization]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/campaign-message-materialization
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Apply Spotless
        run: mvn --batch-mode --no-transfer-progress spotless:apply
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.java'
          git commit -m "style: apply Spotless formatting"
          git push origin HEAD:feat/campaign-message-materialization
