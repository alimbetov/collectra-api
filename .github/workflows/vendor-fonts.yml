name: Vendor bundled fonts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-fonts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download pinned Noto fonts
        run: bash scripts/vendor-fonts.sh

      - name: Commit vendored font binaries
        shell: bash
        run: |
          set -euo pipefail
          git add src/main/resources/fonts
          if git diff --cached --quiet; then
            echo "Bundled fonts are already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Vendor pinned Noto fonts for PDF locales"
          git push origin "HEAD:${GITHUB_REF_NAME}"
