name: Remediation canonical format
on:
  push:
    branches: ["fix/pre-vc9-functional-hardening-remediation"]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress spotless:apply
      - name: Commit formatter-only delta
        run: |
          if git diff --quiet -- src/main/java src/test/java; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java src/test/java
          git commit -m "style: apply canonical Spotless formatting"
          git push origin HEAD:fix/pre-vc9-functional-hardening-remediation
