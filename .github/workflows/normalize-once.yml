name: Normalize branch
on:
  push:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/integration-contract-foundation
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress spotless:apply
      - run: mvn --batch-mode --no-transfer-progress -Dcollectra.openapi.update-baseline=true -Dtest=OpenApiCompatibilityIntegrationTest#publicApiRemainsBackwardCompatibleWithReviewedBaseline test
      - name: Commit generated normalization
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.java' src/test/resources/openapi/collectra-api-v1-baseline.json
          git commit -m "chore: normalize formatting and reviewed OpenAPI baseline"
          git push
