name: R11 Merge Spotless

on:
  push:
    branches:
      - feat/reporting-r11-daily-projections

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/reporting-r11-daily-projections
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress spotless:apply
      - name: Commit formatter output
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java src/test/java
          git commit -m "style(reporting): format final R1.1 SQL fix"
          git push origin HEAD:feat/reporting-r11-daily-projections
