name: T2 OpenAPI Baseline Once

on:
  push:
    branches:
      - feat/template-studio-t2-vertical

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/template-studio-t2-vertical
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Regenerate reviewed OpenAPI baseline
        run: ./scripts/update-openapi-baseline.sh
      - name: Commit baseline
        run: |
          if git diff --quiet -- src/test/resources/openapi/collectra-api-v1-baseline.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/test/resources/openapi/collectra-api-v1-baseline.json
          git commit -m "test(openapi): accept T2 template contract"
          git push origin HEAD:feat/template-studio-t2-vertical
