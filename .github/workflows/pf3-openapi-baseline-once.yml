name: PF3 OpenAPI Baseline Once

on:
  push:
    branches:
      - feat/platform-pf3-user-administration

permissions:
  contents: write

jobs:
  baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/platform-pf3-user-administration
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Regenerate reviewed OpenAPI baseline
        run: bash scripts/update-openapi-baseline.sh
      - name: Commit PF3 baseline
        run: |
          if git diff --quiet -- src/test/resources/openapi/collectra-api-v1-baseline.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/test/resources/openapi/collectra-api-v1-baseline.json
          git commit -m "test(openapi): accept reviewed PF3 platform contract"
          git push origin HEAD:feat/platform-pf3-user-administration
