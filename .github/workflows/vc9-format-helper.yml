name: VC9 formatter helper
on:
  push:
    branches: [ feat/vc9-tenant-analytics ]
permissions:
  contents: write
jobs:
  format:
    if: github.event.head_commit.message != 'style: apply canonical VC-9 spotless output'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/vc9-tenant-analytics
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress spotless:apply
      - name: Commit canonical formatter output
        run: |
          git diff --check
          if git diff --quiet; then
            echo "No formatter changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/io/collectra/api/reporting/application/FinancialProjectionRebuildService.java \
                  src/main/java/io/collectra/api/reporting/application/TenantFinancialAnalyticsQueryService.java \
                  src/main/java/io/collectra/api/reporting/api/TenantFinancialAnalyticsController.java \
                  src/test/java/io/collectra/api/TenantFinancialAnalyticsIntegrationTest.java
          git commit -m "style: apply canonical VC-9 spotless output"
          git push origin HEAD:feat/vc9-tenant-analytics
