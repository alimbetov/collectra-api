name: R12 Focused Reporting

on:
  push:
    branches:
      - feat/reporting-r12-communication-coverage

jobs:
  reporting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/reporting-r12-communication-coverage
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress -Dtest=CommunicationAnalyticsIntegrationTest test
