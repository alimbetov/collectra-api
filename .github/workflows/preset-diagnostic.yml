name: Preset API Diagnostic

on:
  push:
    branches: ["feature/preset-catalog-api"]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compile main sources
        run: mvn --batch-mode --no-transfer-progress -DskipTests compile
      - name: Compile test sources
        run: mvn --batch-mode --no-transfer-progress -DskipTests test-compile
      - name: Run preset unit tests
        run: mvn --batch-mode --no-transfer-progress -Dtest=TemplatePresetApplicationServiceUnitTest,TemplatePresetCatalogServiceUnitTest test
