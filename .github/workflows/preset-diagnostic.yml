name: Preset API Diagnostic

on:
  push:
    branches: ["feature/preset-catalog-api"]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compile main sources
        run: mvn --batch-mode --no-transfer-progress -DskipTests compile
      - name: Compile test sources
        run: mvn --batch-mode --no-transfer-progress -DskipTests test-compile
      - name: Run locale seed application scenario
        id: locale-seed
        continue-on-error: true
        run: mvn --batch-mode --no-transfer-progress -Dtest=TemplatePresetApplicationServiceUnitTest#createsUzbekDraftFromRussianFallbackWithoutChangingTargetLocale test
      - name: Upload surefire report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preset-surefire-report
          path: target/surefire-reports/
      - name: Fail when locale seed scenario failed
        if: steps.locale-seed.outcome == 'failure'
        run: exit 1
