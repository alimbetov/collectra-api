name: Preset API Diagnostic

on:
  push:
    branches: ["feature/preset-catalog-api"]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compile main sources
        run: mvn --batch-mode --no-transfer-progress -DskipTests compile
      - name: Compile test sources
        run: mvn --batch-mode --no-transfer-progress -DskipTests test-compile
      - name: Run locale seed application scenario
        shell: bash
        run: |
          if ! mvn --batch-mode --no-transfer-progress -Dtest=TemplatePresetApplicationServiceUnitTest#createsUzbekDraftFromRussianFallbackWithoutChangingTargetLocale test; then
            report=$(find target/surefire-reports -name '*.txt' -type f -maxdepth 1 -print -quit)
            if [ -n "$report" ]; then
              while IFS= read -r line; do
                safe=${line//'%'/'%25'}
                safe=${safe//$'\r'/'%0D'}
                safe=${safe//$'\n'/'%0A'}
                echo "::error::$safe"
              done < "$report"
            fi
            exit 1
          fi
      - name: Run automatic template bootstrap scenario
        run: mvn --batch-mode --no-transfer-progress -Dtest=TemplatePresetApplicationServiceUnitTest#createsTenantTemplateAutomaticallyWhenTemplateIdIsOmitted test
      - name: Run preset catalog unit test
        run: mvn --batch-mode --no-transfer-progress -Dtest=TemplatePresetCatalogServiceUnitTest test
