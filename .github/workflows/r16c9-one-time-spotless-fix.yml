name: R1.6C.9 One-Time Spotless Repair
on:
  push:
    branches: [feat/iam-shared-platform]
    paths:
      - '.github/workflows/r16c9-one-time-spotless-fix.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/iam-shared-platform
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Apply configured Spotless formatting
        run: mvn -B -ntp spotless:apply
      - name: Verify formatting
        run: mvn -B -ntp spotless:check
      - name: Commit formatting to existing branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- src/main/java src/test/java
          if ! git diff --cached --quiet; then
            git commit -m "style: apply configured Spotless formatting"
            git push origin HEAD:feat/iam-shared-platform
          fi
