name: CI

on:
  push:
    branches: [main, "feature/**", "feat/**", "chore/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build metadata
        run: |
          echo "branch=${GITHUB_REF_NAME}"
          echo "sha=$(git rev-parse HEAD)"
          git log -1 --oneline
      - name: Check formatting
        run: mvn --batch-mode --no-transfer-progress spotless:check
      - name: Slice 7 focused unit tests
        run: bash scripts/test-slice-07.sh unit
      - name: Verify with PostgreSQL Testcontainers and critical-core coverage
        run: mvn --batch-mode --no-transfer-progress clean verify -Pslice10a-coverage
      - name: Upload current OpenAPI contract
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collectra-api-v1-openapi
          path: target/openapi/collectra-api-v1-current.json
          if-no-files-found: ignore
      - name: Upload critical-core coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slice10a-jacoco
          path: target/site/jacoco
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontendweb
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontendweb/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend typecheck
        run: npm run typecheck
      - name: Frontend tests
        run: npm run test:ci
      - name: Frontend production build
        run: npm run build
