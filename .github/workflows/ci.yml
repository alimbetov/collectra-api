name: CI

on:
  push:
    branches: [main, "feature/**", "feat/**", "chore/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build metadata
        run: |
          echo "branch=${GITHUB_REF_NAME}"
          echo "sha=$(git rev-parse HEAD)"
          git log -1 --oneline
      - name: Capture Spotless repair diff
        run: |
          mvn --batch-mode --no-transfer-progress spotless:apply
          git diff -- src/test/java
          if ! git diff --quiet -- src/test/java; then
            exit 1
          fi
      - name: Verify with PostgreSQL Testcontainers
        run: mvn --batch-mode --no-transfer-progress clean verify
