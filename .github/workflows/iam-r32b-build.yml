name: IAM R3.2B build and contract tests
on:
  push:
    branches: [feat/iam-shared-platform]
    paths:
      - 'app-common/**'
      - 'frontendweb/**'
      - '.github/workflows/iam-r32b-build.yml'
  workflow_dispatch:
jobs:
  app-common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: app-common/pom.xml
      - name: Compile and run App Common tests
        working-directory: app-common
        run: mvn -B -ntp clean verify
  react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: frontendweb/package-lock.json
      - name: Install locked dependencies
        working-directory: frontendweb
        run: npm ci
      - name: Typecheck
        working-directory: frontendweb
        run: npm run typecheck
      - name: Run Vitest
        working-directory: frontendweb
        run: npm run test:ci
      - name: Build React
        working-directory: frontendweb
        run: npm run build
