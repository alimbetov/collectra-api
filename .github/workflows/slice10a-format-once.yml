name: Slice 10A format once

on:
  push:
    branches:
      - feat/slice-10a-test-lab-consolidated

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/slice-10a-test-lab-consolidated
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Apply Spotless
        run: ./mvnw -q spotless:apply
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/test/java
          git commit -m "style: format Slice 10A tests"
          git push origin HEAD:feat/slice-10a-test-lab-consolidated
