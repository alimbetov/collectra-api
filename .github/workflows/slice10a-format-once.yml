name: Slice 10A format once

on:
  push:
    branches:
      - feat/slice-10a-test-lab-consolidated

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/slice-10a-test-lab-consolidated
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Apply Spotless
        id: spotless
        continue-on-error: true
        run: mvn -B -ntp spotless:apply > spotless.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slice10a-spotless-log
          path: spotless.log
      - name: Fail when Spotless failed
        if: steps.spotless.outcome != 'success'
        run: |
          cat spotless.log
          exit 1
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply Spotless to Slice 10A P08"
          git push
