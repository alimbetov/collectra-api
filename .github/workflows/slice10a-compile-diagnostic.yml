name: Slice 10A compile diagnostic

on:
  push:
    branches:
      - feat/slice-10a-test-lab-consolidated

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile tests
        id: compile
        continue-on-error: true
        run: mvn -B -ntp -DskipTests test-compile > compile.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slice10a-compile-log
          path: compile.log
      - name: Fail on compile errors
        if: steps.compile.outcome != 'success'
        run: exit 1
