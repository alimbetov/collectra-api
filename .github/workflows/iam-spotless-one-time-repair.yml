name: IAM one-time Spotless repair
on:
  push:
    branches: [feat/iam-shared-platform]
    paths:
      - '.github/workflows/iam-spotless-one-time-repair.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Apply repository Spotless rule
        run: mvn --batch-mode --no-transfer-progress spotless:apply
      - name: Commit only automatic formatting changes
        run: |
          if test -n "$(git status --porcelain)"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -u
            git commit -m "style(iam): apply repository Spotless formatting to branch changes"
            git push origin HEAD:refs/heads/feat/iam-shared-platform
          else
            echo 'Nothing to format'
          fi
