name: Slice 10A coverage once

on:
  push:
    branches:
      - feat/slice-10a-test-lab-consolidated

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Check formatting
        run: mvn --batch-mode --no-transfer-progress spotless:check
      - name: Verify Slice 10A coverage
        run: mvn --batch-mode --no-transfer-progress clean verify -Pslice10a-coverage
