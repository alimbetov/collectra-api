name: IAM dual-contour revocation PostgreSQL gate
on:
  workflow_dispatch:
  push:
    branches: [feat/iam-shared-platform]
    paths:
      - 'app-common/src/main/java/io/collectra/platform/revocation/**'
      - 'app-common/src/test/java/io/collectra/platform/revocation/**'
      - 'src/main/java/io/collectra/api/shared/security/**'
      - 'src/test/java/io/collectra/api/shared/security/**'
      - 'scripts/smoke-iam-macos.sh'
      - 'compose.iam-smoke.yaml'
      - '.github/workflows/iam-dual-contour-revocation-gate.yml'
permissions:
  contents: read
jobs:
  g2-macos-runner-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate macOS G2 script syntax
        run: bash -n scripts/smoke-iam-macos.sh
      - name: Validate real AC/COL Docker Compose topology
        env:
          IAM_DB_PASSWORD: ci-dummy
          IAM_KC_BOOTSTRAP_PASSWORD: ci-dummy
          IAM_KC_ADMIN_CLIENT_SECRET: ci-dummy
          IAM_OPERATOR_CLIENT_SECRET: ci-dummy
          IAM_CONSUMER_CLIENT_SECRET: ci-dummy
          IAM_RABBIT_PASSWORD: ci-dummy
          IAM_STORAGE_ACCESS_KEY: ci-dummy
          IAM_STORAGE_SECRET_KEY: ci-dummy
          IAM_COLLECTRA_JWT_SECRET: ci-dummy
          IAM_OTP_PEPPER: ci-dummy
          IAM_USER_PASSWORD: ci-dummy
        run: docker compose -f compose.iam-smoke.yaml config --quiet
  ac-revocation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: app-common/pom.xml
      - name: AC PostgreSQL HTTP ACK and consistency
        working-directory: app-common
        run: mvn -B -ntp -Dtest=RevocationHttpAckPostgresIT,RevocationConsistencyPostgresIT,RevocationTokenValidatorTest test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ac-revocation-reports
          path: app-common/target/surefire-reports/
          if-no-files-found: error
  col-revocation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: COL PostgreSQL snapshot monotonicity and fail-closed
        run: mvn -B -ntp -Dtest=RevocationSnapshotPostgresIT,GlobalRevocationGateTest,KeycloakDomainAuthorizationFilterTest,RevocationSnapshotConsumerHttpTest,CredentialAuthorityMigrationServiceTest,CredentialAuthorityMigrationPostgresIT,AuthorizationVersionFilterUnitTest test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: col-revocation-reports
          path: target/surefire-reports/
          if-no-files-found: error
