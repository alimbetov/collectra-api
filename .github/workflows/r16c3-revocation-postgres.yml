name: R1.6C.3 PostgreSQL revocation gate
on:
  workflow_dispatch:
  push:
    branches: [feat/iam-shared-platform]
    paths:
      - 'src/main/java/io/collectra/api/shared/security/**'
      - 'src/test/java/io/collectra/api/shared/security/**'
      - 'src/main/resources/db/changelog/**'
      - '.github/workflows/r16c3-revocation-postgres.yml'
permissions:
  contents: read
jobs:
  postgres-revocation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: PostgreSQL Testcontainers — fail on any failure
        run: mvn -B -ntp -Dtest=RevocationSnapshotPostgresIT test
      - name: Preserve surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r16c3-postgres-surefire
          path: target/surefire-reports/
          if-no-files-found: warn
