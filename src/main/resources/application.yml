spring:
  application:
    name: collectra-api
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/collectra}
    username: ${DB_USERNAME:collectra}
    password: ${DB_PASSWORD:collectra}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true
  tracing.sampling.probability: 1.0
springdoc:
  swagger-ui.path: /swagger-ui.html
collectra:
  messaging:
    outbox-publish-delay-ms: 1000
  storage:
    endpoint: ${COLLECTRA_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${COLLECTRA_STORAGE_ACCESS_KEY:rustfsadmin}
    secret-key: ${COLLECTRA_STORAGE_SECRET_KEY:rustfsadmin}
    bucket: ${COLLECTRA_STORAGE_BUCKET:collectra-documents}
  security:
    jwt-secret: ${COLLECTRA_JWT_SECRET:local-development-secret-change-me-123456789}
    access-token-ttl: PT15M
    refresh-token-ttl: 30d
    otp-pepper: ${COLLECTRA_OTP_PEPPER:local-development-otp-pepper-change-me}
    expose-otp: false
logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}, correlationId=%X{correlationId:-}]"
