spring:
  application:
    name: collectra-api
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true
springdoc:
  swagger-ui.path: /swagger-ui.html
collectra:
  communication:
    delivery:
      enabled: false
      provider: disabled
      simulation:
        success-rate-percent: 80
        permanent-failure-rate-percent: 10
    processing-timeout: 5m
    recovery-batch-size: 100
    recovery-delay: 1m
    retry-dispatch-batch-size: 100
    retry-dispatch-delay: 1m
    kumomta:
      base-url: ""
      envelope-sender: ""
      from-header: ""
      username: ""
      password: ""
      connect-timeout: 2s
      read-timeout: 10s
  messaging:
    outbox-publish-delay-ms: 1000
    outbox-recovery-delay-ms: 60000
    outbox-batch-size: 50
    outbox-max-attempts: 6
    outbox-processing-timeout: PT2M
    publisher-confirm-timeout-ms: 5000
  file:
    direct-upload-max-size: 50MB
    storage:
      provider: rustfs
      region: us-east-1
      path-style-access: true
      buckets:
        source: collectra-source
        generated: collectra-generated
        assets: collectra-assets
        temp: collectra-temp
    retention:
      import-source: 90d
      report: 90d
      export: 90d
      temp: 3d
    cleanup:
      cron: "0 0 3 * * *"
      batch-size: 500
      max-delete-attempts: 10
      max-batches-per-run: 20
      retry-delay: 15m
    presigned-url:
      download-ttl: 10m
      upload-ttl: 30m
  security:
    access-token-ttl: PT15M
    refresh-token-ttl: 30d
    expose-otp: false
logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}, correlationId=%X{correlationId:-}]"
