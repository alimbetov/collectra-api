spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/app_db
    username: devuser
    password: devpass
  rabbitmq:
    host: localhost
    port: 5672
    username: devuser
    password: devpass
  jpa.show-sql: false
management:
  endpoint.health.show-details: always
  tracing.sampling.probability: 1.0

collectra:
  communication:
    delivery:
      provider: simulated
  storage:
    endpoint: http://localhost:9000
    access-key: rustfsadmin
    secret-key: rustfsadmin
    bucket: collectra-documents
    region: us-east-1
    path-style-access: true
  file:
    storage:
      endpoint: http://localhost:9000
      access-key: rustfsadmin
      secret-key: rustfsadmin
      region: us-east-1
      path-style-access: true
  security:
    jwt-secret: local-development-secret-change-me-123456789
    otp-pepper: local-development-otp-pepper-change-me
